name: Build Media3 FFmpeg Extension (with video)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VER: 26.1.10909125
      CMAKE_VER: 3.31.1

    steps:
      - name: Checkout Jellyfin fork (supports video)
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-androidx-media
          ref: master
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NDK and CMake
        run: |
          echo "=== 安装 NDK $NDK_VER 与 CMake $CMAKE_VER ==="
          yes | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${NDK_VER}" "cmake;${CMAKE_VER}"

      - name: Build FFmpeg native libraries (with video)
        run: |
          echo "=== 编译带视频解码的 FFmpeg（fork 自带脚本）==="
          ./build.sh

      - name: Build AAR and publish to Maven local
        run: |
          echo "=== 编译带视频解码的 AAR ==="
          ./gradlew :media3-ffmpeg-decoder:publishToMavenLocal

      - name: Locate AAR
        id: aar
        run: |
          echo "=== 查找 AAR 文件 ==="
          AAR_FILE=$(find . -name "media3-ffmpeg-decoder*.aar" 2>/dev/null | head -1)
          if [ -z "$AAR_FILE" ]; then
            echo "❌ 没找到 AAR 文件"
            find . -name "*.aar" 2>/dev/null
            exit 1
          fi
          echo "AAR 文件：$AAR_FILE"
          echo "artifact=$AAR_FILE" >> "$GITHUB_OUTPUT"

      - name: 验证 AAR 内容
        run: |
          AAR_FILE="${{ steps.aar.outputs.artifact }}"
          echo "大小：$(du -h "$AAR_FILE" | cut -f1)"
          echo ""
          echo "=== AAR 内容列表 ==="
          unzip -l "$AAR_FILE"
          echo ""
          echo "=== 检查 jni/so 目录 ==="
          unzip -l "$AAR_FILE" | grep -iE "jni|\.so" | head -20 || echo "没找到 jni/so"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-decoder-with-video
          path: ${{ steps.aar.outputs.artifact }}
